name: Deploy Dev

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Serverless Framework
        run: |
          npm install -g serverless@3
          npm install

      - name: Deploy to AWS Lambda (dev)
        # CUTOVER 2026-07-06: dev apunta a las tablas REALES (units, tires, sensors,
        # tboxes), ya no a los clones test_. Sin TABLE_PREFIX = sin prefijo (serverless.yml
        # lo default-ea a '' vía ${env:TABLE_PREFIX, ''}).
        run: serverless deploy --stage dev --verbose
        env:
          # Alerta de caída de la plataforma por WhatsApp (functions/monitoring/plataforma.py).
          INCIDENT_NOTIFY_ENABLED: ${{ vars.INCIDENT_NOTIFY_ENABLED }}
          WHATSAPP_INCIDENT_TEMPLATE: ${{ vars.WHATSAPP_INCIDENT_TEMPLATE }}
          WHATSAPP_INCIDENT_LANG: ${{ vars.WHATSAPP_INCIDENT_LANG }}
          INCIDENT_WHATSAPP_RECIPIENTS: ${{ secrets.INCIDENT_WHATSAPP_RECIPIENTS }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}

      - name: Display endpoints
        run: serverless info --stage dev
