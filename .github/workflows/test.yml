name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # El umbral esta en 62, por debajo del 67 actual: no rompe hoy, pero
        # impide que la cobertura baje sin que nadie se entere. La configuracion
        # de que se mide esta en .coveragerc, que excluye tests/ para que la
        # cifra no salga inflada por los propios archivos de prueba.
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=62
