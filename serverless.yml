service: AssetManagerService

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  environment:
    # Prefijo de tablas: "test_" para probar contra los clones sin tocar datos reales.
    TABLE_PREFIX: ${env:TABLE_PREFIX, ''}
    COMPANY_ID_CLAIM: ${env:COMPANY_ID_CLAIM, 'custom:company_id'}
    ADMIN_GROUP: ${env:ADMIN_GROUP, 'quinta-admin'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'
        # bulk_create dispara al worker de sincronización y este se re-invoca a sí
        # mismo (continuación por timeout / pases de reintento).
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${sls:stage}-sensorsBulkSyncWorker

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!tests/**'
    - '!.github/**'
    - '!*.md'
    - '!__pycache__/**'
    - '!.venv/**'
    - 'shared/**'
    - 'functions/**'

# --- Autorizador compartido ---------------------------------------------------
# Ancla YAML para no repetir el bloque en los 31 eventos HTTP. Cada evento lo
# aplica con `authorizer: *cognito`.
custom:
  cognitoAuthorizer: &cognito
    type: COGNITO_USER_POOLS
    authorizerId:
      Ref: ApiGatewayAuthorizer

functions:
  createVehicle:
    handler: functions/vehicles/create.handler
    events:
      - http:
          path: /vehicles
          method: post
          cors: true
          authorizer: *cognito

  updateVehicle:
    handler: functions/vehicles/update.handler
    events:
      - http:
          path: /vehicles/{id}
          method: put
          cors: true
          authorizer: *cognito

  getVehicle:
    handler: functions/vehicles/get.handler
    events:
      - http:
          path: /vehicles/{id}
          method: get
          cors: true
          authorizer: *cognito

  createTire:
    handler: functions/tires/create.handler
    events:
      - http:
          path: /tires
          method: post
          cors: true
          authorizer: *cognito

  updateTire:
    handler: functions/tires/update.handler
    events:
      - http:
          path: /tires/{id}
          method: put
          cors: true
          authorizer: *cognito

  createSensor:
    handler: functions/sensors/create.handler
    events:
      - http:
          path: /sensors
          method: post
          cors: true
          authorizer: *cognito

  createTbox:
    handler: functions/tboxes/create.handler
    events:
      - http:
          path: /tboxes
          method: post
          cors: true
          authorizer: *cognito

  listAssets:
    handler: functions/lists/list_assets.handler
    events:
      - http:
          path: /list/{resource}
          method: get
          cors: true
          authorizer: *cognito

  getStatus:
    handler: functions/status/get_status.handler
    events:
      - http:
          path: /status/{resource}/{id}
          method: get
          cors: true
          authorizer: *cognito

  bindTbox:
    handler: functions/vehicles/bind_tbox.handler
    events:
      - http:
          path: /vehicles/{id}/tbox/bind
          method: post
          cors: true
          authorizer: *cognito

  unbindTbox:
    handler: functions/vehicles/unbind_tbox.handler
    events:
      - http:
          path: /vehicles/{id}/tbox/unbind
          method: post
          cors: true
          authorizer: *cognito

  deleteVehicle:
    handler: functions/vehicles/delete.handler
    events:
      - http:
          path: /vehicles/{id}
          method: delete
          cors: true
          authorizer: *cognito

  deleteTire:
    handler: functions/tires/delete.handler
    events:
      - http:
          path: /tires/{id}
          method: delete
          cors: true
          authorizer: *cognito

  deleteSensor:
    handler: functions/sensors/delete.handler
    events:
      - http:
          path: /sensors/{id}
          method: delete
          cors: true
          authorizer: *cognito

  deleteTbox:
    handler: functions/tboxes/delete.handler
    events:
      - http:
          path: /tboxes/{id}
          method: delete
          cors: true
          authorizer: *cognito

  assignSensor:
    handler: functions/sensors/assign.handler
    events:
      - http:
          path: /sensors/{id}/assign
          method: post
          cors: true
          authorizer: *cognito

  assignTbox:
    handler: functions/tboxes/assign.handler
    events:
      - http:
          path: /tboxes/{id}/assign
          method: post
          cors: true
          authorizer: *cognito

  updateTbox:
    handler: functions/tboxes/update.handler
    events:
      - http:
          path: /tboxes/{id}
          method: put
          cors: true
          authorizer: *cognito

  updateSensor:
    handler: functions/sensors/update.handler
    events:
      - http:
          path: /sensors/{id}
          method: put
          cors: true
          authorizer: *cognito

  bindTireToVehicle:
    handler: functions/bindings/bind_tire.handler
    events:
      - http:
          path: /vehicles/{id}/tires/bind
          method: post
          cors: true
          authorizer: *cognito

  unbindTireFromVehicle:
    handler: functions/bindings/unbind_tire.handler
    events:
      - http:
          path: /vehicles/{id}/tires/unbind
          method: post
          cors: true
          authorizer: *cognito

  bindSensorToTire:
    handler: functions/bindings/bind_sensor.handler
    events:
      - http:
          path: /tires/{id}/sensors/bind
          method: post
          cors: true
          authorizer: *cognito

  unbindSensorFromTire:
    handler: functions/bindings/unbind_sensor.handler
    events:
      - http:
          path: /tires/{id}/sensors/unbind
          method: post
          cors: true
          authorizer: *cognito

  # Importación masiva de sensores (Excel en el FE). Inserta el lote local como
  # 'registering' y delega TODO el tráfico a Dajin al worker asíncrono.
  bulkCreateSensors:
    handler: functions/sensors/bulk_create.handler
    environment:
      BULK_SYNC_FUNCTION: ${self:service}-${sls:stage}-sensorsBulkSyncWorker
    events:
      - http:
          path: /sensors/bulk
          method: post
          cors: true
          authorizer: *cognito

  # Worker del bulk: sin API Gateway (sin tope de 29 s). Se auto-encadena si se
  # queda sin tiempo y reintenta a los fallidos hasta MAX_PASSES. Solo toca los
  # ids de su lote — NO es la reconciliación y no ve filas viejas.
  sensorsBulkSyncWorker:
    handler: functions/sensors/bulk_sync_worker.handler
    timeout: 900
    environment:
      BULK_SYNC_FUNCTION: ${self:service}-${sls:stage}-sensorsBulkSyncWorker

  # Paquetes de hardware: kit (1 TBox + N sensores, sin llantas) preparado en la
  # compañía admin (2), movido a otra compañía y luego montado en una unidad real.
  createPackage:
    handler: functions/packages/create.handler
    events:
      - http:
          path: /packages
          method: post
          cors: true
          authorizer: *cognito

  listPackages:
    handler: functions/packages/list.handler
    events:
      - http:
          path: /packages
          method: get
          cors: true
          authorizer: *cognito

  getPackage:
    handler: functions/packages/get.handler
    events:
      - http:
          path: /packages/{id}
          method: get
          cors: true
          authorizer: *cognito

  deletePackage:
    handler: functions/packages/delete.handler
    events:
      - http:
          path: /packages/{id}
          method: delete
          cors: true
          authorizer: *cognito

  movePackage:
    handler: functions/packages/move.handler
    events:
      - http:
          path: /packages/{id}/move
          method: post
          cors: true
          authorizer: *cognito

  # assign crea llantas genéricas cuando la posición está vacía: necesita el
  # catálogo de llanta genérica que usa el alta de esas llantas.
  assignPackage:
    handler: functions/packages/assign.handler
    environment:
      GENERIC_TIRES_CATALOG_ID: ${env:GENERIC_TIRES_CATALOG_ID, ''}
    events:
      - http:
          path: /packages/{id}/assign
          method: post
          cors: true
          authorizer: *cognito

  # unassign deshace el assign: quita el tbox, desvincula los sensores y borra las
  # llantas genéricas que el paquete creó; el paquete vuelve a 'prepared'.
  unassignPackage:
    handler: functions/packages/unassign.handler
    events:
      - http:
          path: /packages/{id}/unassign
          method: post
          cors: true
          authorizer: *cognito

  # Barrido de reconciliación: cierra creates 'registering' y borrados pendientes en Dajin.
  reconcile:
    handler: functions/reconciliation/reconcile.handler
    timeout: 120
    events:
      - schedule:
          rate: rate(5 minutes)
          # CUTOVER 2026-07-06: desactivado temporalmente. Al pasar dev a tablas REALES
          # hay ~137 filas viejas en status='registering' (120 sensors, 9 tires, 8 tboxes)
          # que este barrido finalizaría en masa. Reactivar tras revisarlas manualmente.
          enabled: false

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    slim: true
    strip: false

# API Gateway ejecuta este autorizador ANTES de cualquier Lambda: valida el JWT
# de Cognito y deja las claims verificadas en
# event.requestContext.authorizer.claims, que es de donde shared/auth.py deriva
# la empresa y el actor de la bitacora.
resources:
  Resources:
    ApiGatewayAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoUserPoolAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId:
          Ref: ApiGatewayRestApi
        ProviderARNs:
          # TODO(before merge): confirmar el user pool que atiende esta API.
          - ${env:COGNITO_USER_POOL_ARN}
